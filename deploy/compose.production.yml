name: ${COMPOSE_PROJECT_NAME:-sipad}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16.6-alpine3.21
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    cpus: 1.0
    logging: *default-logging

  backend:
    image: ${IMAGE_REGISTRY:-local}/sipad-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      AUTO_SCHEMA_BOOTSTRAP: ${AUTO_SCHEMA_BOOTSTRAP:-false}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ASYNC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      UPLOAD_DIR: /app/backend/data/uploads
      BILLING_MEDIA_DIR: /app/backend/data/billing-media
      BILLING_MEDIA_PUBLIC_BASE_URL: ${BILLING_MEDIA_PUBLIC_BASE_URL:-}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-}
      DOCENTE_DEFAULT_PASSWORD: ${DOCENTE_DEFAULT_PASSWORD:?DOCENTE_DEFAULT_PASSWORD is required}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com}
      EMAIL_TIMEOUT_SECONDS: ${EMAIL_TIMEOUT_SECONDS:-3.0}
      EMAIL_TEST_MODE: ${EMAIL_TEST_MODE:-false}
      EMAIL_TEST_RECIPIENT: ${EMAIL_TEST_RECIPIENT:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_MODE: ${WHATSAPP_MODE:-sandbox}
      OFFICIAL_WHATSAPP_ENABLED: ${OFFICIAL_WHATSAPP_ENABLED:-false}
      WHATSAPP_DISPATCH_ENABLED: ${WHATSAPP_DISPATCH_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      TWILIO_WHATSAPP_SANDBOX_FROM: ${TWILIO_WHATSAPP_SANDBOX_FROM:-}
      TWILIO_OFFICIAL_FROM: ${TWILIO_OFFICIAL_FROM:-}
      TWILIO_OFFICIAL_SENDER_SID: ${TWILIO_OFFICIAL_SENDER_SID:-}
      TWILIO_OFFICIAL_CONTENT_SID: ${TWILIO_OFFICIAL_CONTENT_SID:-}
      TWILIO_STATUS_CALLBACK_URL: ${TWILIO_STATUS_CALLBACK_URL:-}
      TWILIO_INBOUND_CALLBACK_URL: ${TWILIO_INBOUND_CALLBACK_URL:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_OFFICIAL_MEDIA_MPS: ${TWILIO_OFFICIAL_MEDIA_MPS:-0}
      TWILIO_OFFICIAL_MOVING_RECIPIENT_LIMIT: ${TWILIO_OFFICIAL_MOVING_RECIPIENT_LIMIT:-0}
      TWILIO_OFFICIAL_CAPACITY_WINDOW_SECONDS: ${TWILIO_OFFICIAL_CAPACITY_WINDOW_SECONDS:-86400}
      TWILIO_WHATSAPP_SANDBOX_TEST_RECIPIENT: ${TWILIO_WHATSAPP_SANDBOX_TEST_RECIPIENT:-}
      TWILIO_API_BASE_URL: ${TWILIO_API_BASE_URL:-https://api.twilio.com}
      WHATSAPP_TIMEOUT_SECONDS: ${WHATSAPP_TIMEOUT_SECONDS:-3.0}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - ${BACKEND_WORKERS:-2}
      - --proxy-headers
      - --forwarded-allow-ips=*
    volumes:
      - uploads_data:/app/backend/data/uploads
      - billing_media_data:/app/backend/data/billing-media
      - output_data:/app/backend/data/output
      - reports_data:/app/backend/data/reports
      - contracts_data:/app/backend/data/contracts
      - schedules_data:/app/backend/data/schedules
      - retention_letters_data:/app/backend/data/retention_letters
      - app_backups_data:/app/backend/data/backups
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks:
      - edge_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    cpus: 1.5
    logging: *default-logging

  official_whatsapp_worker:
    extends:
      service: backend
    command: ["python", "-m", "app.workers.official_whatsapp_runner"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          tr '\0' ' ' </proc/1/cmdline | grep -Fq app.workers.official_whatsapp_runner && python -c "from sqlalchemy import text; from app.database import SessionLocal; db=SessionLocal(); db.execute(text('SELECT 1')); db.close()"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

  app:
    image: ${IMAGE_REGISTRY:-local}/sipad-app:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "127.0.0.1:${APP_HOST_PORT:?APP_HOST_PORT is required}:8080"
    networks:
      - edge_net
      - backend_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${APP_MEMORY_LIMIT:-256m}
    cpus: 0.5
    logging: *default-logging

networks:
  edge_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  uploads_data:
  billing_media_data:
  output_data:
  reports_data:
  contracts_data:
  schedules_data:
  retention_letters_data:
  app_backups_data:
