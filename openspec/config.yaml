# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Python 3.11 backend with FastAPI, SQLAlchemy 2.x, Alembic, PostgreSQL runtime with SQLite test fallback; React 19 + TypeScript + Vite 8 frontend with TanStack Query, Tailwind 4, shadcn/ui, and React Router 7
  Architecture: Layered backend (routers/services/models/schemas/utils), componentized frontend (pages/components/api/hooks/context/lib), Alembic migrations + runtime column migrations, Vite dev proxy to backend API
  Testing: pytest 8 + pytest-asyncio + httpx backend tests, Playwright E2E frontend tests, no frontend unit runner
  Style: ESLint flat config + typescript-eslint + TypeScript strict mode (frontend), no backend linter/type checker/formatter configured
  Auth: JWT (python-jose + passlib/bcrypt), role-based (admin/docente)
  PDF generation: ReportLab (contracts, retention letters, schedules, audit reports)

strict_tdd: false

testing:
  strict_tdd: false
  detected: "2026-08-15"
  backend:
    runner:
      command: "pytest"
      framework: "pytest 8.3.3"
    layers:
      unit: true
      integration: true
      e2e: true
    integration_tools: "httpx + FastAPI TestClient"
    coverage:
      available: false
      command: null
      note: "pytest-cov not in requirements.txt — install with: pip install pytest-cov"
    quality:
      linter: null
      type_checker: null
      formatter: null
  frontend:
    runner:
      command: "playwright test"
      framework: "@playwright/test"
    layers:
      unit: false
      integration: false
      e2e: true
    coverage:
      available: false
    quality:
      linter:
        available: true
        command: "npm run lint"
      type_checker:
        available: true
        command: "npm run build"
      formatter:
        available: false
        note: "Consider adding prettier"

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    guidelines:
      - Follow existing code patterns and conventions
      - Load relevant coding skills for the project stack
    tdd: false
    test_command: "pytest"
  verify:
    test_command: "pytest"
    build_command: "cd frontend && npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas (large removals)
